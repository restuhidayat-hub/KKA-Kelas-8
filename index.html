<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure of Nested Loops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
        --primary: #10b981;
        --secondary: #6366f1;
        --accent: #a855f7;
        --bg: #0f172a;
    }

    body {
      box-sizing: border-box;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Efek Kaca (Glassmorphism) */
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    /* Blok Kode yang lebih menarik */
    .code-block {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .code-block:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
    }

    .placed-block {
      animation: slideIn 0.3s ease-out;
      border-left: 5px solid var(--primary);
      background: rgba(15, 23, 42, 0.8) !important;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .block-dragging { opacity: 0.4; transform: scale(0.9); }
    
    .drop-zone-active {
      background-color: rgba(16, 185, 129, 0.1);
      border: 2px dashed var(--primary) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

    /* Virtual Keyboard styling */
    .key-btn {
      transition: all 0.1s;
      background: #334155;
      border: 1px solid #475569;
    }
    .key-btn:active {
      background: var(--accent);
      transform: scale(0.9);
    }
  </style>
</head>
<body class="h-full">
  <div id="app" class="h-full w-full overflow-auto"></div>

  <div id="virtual-keyboard" class="fixed bottom-0 left-0 right-0 bg-[#1e293b] p-4 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] z-[1000] hidden">
    <div class="flex flex-col gap-2 max-w-2xl mx-auto">
        <div class="flex justify-center gap-1.5"><button class="key-btn w-10 h-12 rounded" data-key="1">1</button><button class="key-btn w-10 h-12 rounded" data-key="2">2</button><button class="key-btn w-10 h-12 rounded" data-key="3">3</button><button class="key-btn w-10 h-12 rounded" data-key="4">4</button><button class="key-btn w-10 h-12 rounded" data-key="5">5</button><button class="key-btn w-10 h-12 rounded" data-key="6">6</button><button class="key-btn w-10 h-12 rounded" data-key="7">7</button><button class="key-btn w-10 h-12 rounded" data-key="8">8</button><button class="key-btn w-10 h-12 rounded" data-key="9">9</button><button class="key-btn w-10 h-12 rounded" data-key="0">0</button></div>
        <div class="flex justify-center gap-1.5"><button class="key-btn w-10 h-12 rounded" data-key="Q">Q</button><button class="key-btn w-10 h-12 rounded" data-key="W">W</button><button class="key-btn w-10 h-12 rounded" data-key="E">E</button><button class="key-btn w-10 h-12 rounded" data-key="R">R</button><button class="key-btn w-10 h-12 rounded" data-key="T">T</button><button class="key-btn w-10 h-12 rounded" data-key="Y">Y</button><button class="key-btn w-10 h-12 rounded" data-key="U">U</button><button class="key-btn w-10 h-12 rounded" data-key="I">I</button><button class="key-btn w-10 h-12 rounded" data-key="O">O</button><button class="key-btn w-10 h-12 rounded" data-key="P">P</button></div>
        <div class="flex justify-center gap-1.5"><button class="key-btn w-10 h-12 rounded" data-key="A">A</button><button class="key-btn w-10 h-12 rounded" data-key="S">S</button><button class="key-btn w-10 h-12 rounded" data-key="D">D</button><button class="key-btn w-10 h-12 rounded" data-key="F">F</button><button class="key-btn w-10 h-12 rounded" data-key="G">G</button><button class="key-btn w-10 h-12 rounded" data-key="H">H</button><button class="key-btn w-10 h-12 rounded" data-key="J">J</button><button class="key-btn w-10 h-12 rounded" data-key="K">K</button><button class="key-btn w-10 h-12 rounded" data-key="L">L</button></div>
        <div class="flex justify-center gap-1.5"><button class="key-btn px-4 h-12 rounded" data-key="SHIFT">⇧ Shift</button><button class="key-btn w-10 h-12 rounded" data-key="Z">Z</button><button class="key-btn w-10 h-12 rounded" data-key="X">X</button><button class="key-btn w-10 h-12 rounded" data-key="C">C</button><button class="key-btn w-10 h-12 rounded" data-key="V">V</button><button class="key-btn w-10 h-12 rounded" data-key="B">B</button><button class="key-btn w-10 h-12 rounded" data-key="N">N</button><button class="key-btn w-10 h-12 rounded" data-key="M">M</button><button class="key-btn px-4 h-12 rounded" data-key="BACKSPACE">⌫</button></div>
        <div class="flex justify-center gap-1.5"><button class="key-btn flex-1 h-12 rounded uppercase font-bold" data-key="SPACE">Space</button><button class="key-btn px-8 h-12 rounded bg-green-600 border-none font-bold" data-key="CLOSE">✓ Selesai</button></div>
    </div>
  </div>

  <script>
    const config = {
      primary_color: "#10b981",
      secondary_color: "#6366f1",
      accent_color: "#a855f7",
      text_color: "#f8fafc",
      game_title: "🚀 Pertualangan Nested Loop",
      instruction_text: "Misi: Susun logika perulangan untuk membentuk rasi bintang!"
    };

    let gameState = {
      currentLevel: 1,
      score: 0,
      draggedBlock: null,
      playerName: '',
      startTime: null,
      gameStarted: false
    };

    // Data Level Tetap Sama (Sesuai Struktur Anda)
    const levels = [
      {
        level: 1,
        title: "Level 1: Baris Sederhana",
        description: "Buat 1 baris dengan 5 bintang",
        target: "★★★★★",
        variables: "i = penghitung baris",
        requiredBlocks: [{ type: "for", label: "FOR i = 1 TO 5", iterations: 5, order: 0, isCorrect: true }],
        distractorBlocks: [{ type: "for", label: "FOR i = 1 TO 3", iterations: 3, order: 0, isCorrect: false }]
      },
      {
        level: 2,
        title: "Level 2: Dua Baris",
        description: "Buat 2 baris, masing-masing 4 bintang",
        target: "★★★★\n★★★★",
        variables: "i = baris, j = bintang",
        requiredBlocks: [
          { type: "for", label: "FOR i = 1 TO 2", iterations: 2, order: 0, isCorrect: true },
          { type: "for", label: "FOR j = 1 TO 4", iterations: 4, order: 1, isCorrect: true }
        ],
        distractorBlocks: [{ type: "for", label: "FOR j = 1 TO 2", iterations: 2, order: 1, isCorrect: false }]
      },
      {
        level: 3,
        title: "Level 3: Kotak 3x3",
        description: "Buat kotak 3 baris × 3 kolom",
        target: "★★★\n★★★\n★★★",
        variables: "i = baris, j = kolom",
        requiredBlocks: [
          { type: "for", label: "FOR i = 1 TO 3", iterations: 3, order: 0, isCorrect: true },
          { type: "for", label: "FOR j = 1 TO 3", iterations: 3, order: 1, isCorrect: true }
        ],
        distractorBlocks: [{ type: "for", label: "FOR i = 1 TO 4", iterations: 4, order: 0, isCorrect: false }]
      },
      {
        level: 4,
        title: "Level 4: Tangga Naik",
        description: "Buat pola tangga naik",
        target: "★\n★★\n★★★\n★★★★",
        variables: "i = baris, j = bintang (maksimal = i)",
        requiredBlocks: [
          { type: "for", label: "FOR i = 1 TO 4", iterations: 4, order: 0, isCorrect: true },
          { type: "for", label: "FOR j = 1 TO i", iterations: "variable", order: 1, isCorrect: true }
        ],
        distractorBlocks: [{ type: "for", label: "FOR j = 1 TO 4", iterations: 4, order: 1, isCorrect: false }]
      },
      {
        level: 5,
        title: "Level 5: Piramida",
        description: "Buat piramida sempurna 4 tingkat",
        target: "    ★\n  ★★★\n ★★★★★\n★★★★★★★",
        variables: "i = baris, s = spasi (4-i), j = bintang (2*i-1)",
        requiredBlocks: [
          { type: "for", label: "FOR i = 1 TO 4", iterations: 4, order: 0, isCorrect: true },
          { type: "for", label: "FOR s = 1 TO (4-i)", iterations: "variable", order: 1, isCorrect: true },
          { type: "for", label: "FOR j = 1 TO (2*i-1)", iterations: "variable", order: 2, isCorrect: true }
        ],
        distractorBlocks: [{ type: "for", label: "FOR s = 1 TO i", iterations: "variable", order: 1, isCorrect: false }]
      }
    ];

    function initApp() {
      renderApp();
    }

    function renderNameScreen() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="h-full flex items-center justify-center p-6">
                <div class="glass-card p-10 rounded-2xl max-w-md w-full text-center">
                    <h1 class="text-4xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                        ${config.game_title}
                    </h1>
                    <p class="mb-8 opacity-80">Masukkan namamu untuk memulai misi ini!</p>
                    <input type="text" id="player-name-input" 
                        class="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl mb-6 text-center text-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                        placeholder="Nama Hero..." />
                    <button id="start-game-btn" class="w-full py-4 rounded-xl font-bold text-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 transition-all shadow-lg shadow-indigo-500/20">
                        MULAI PETUALANGAN
                    </button>
                </div>
            </div>
        `;

        document.getElementById('start-game-btn').onclick = () => {
            const name = document.getElementById('player-name-input').value;
            if(name) {
                gameState.playerName = name;
                gameState.gameStarted = true;
                gameState.startTime = new Date();
                renderApp();
            }
        };
    }

    function renderApp() {
      if (!gameState.gameStarted) {
        renderNameScreen();
        return;
      }
      
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="min-h-full p-6 max-w-6xl mx-auto">
          <div class="flex flex-wrap justify-between items-center gap-4 mb-8 glass-card p-4 rounded-2xl">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center font-bold">👤</div>
                <div>
                    <div class="text-xs opacity-60 uppercase font-bold tracking-wider">Player</div>
                    <div class="font-bold text-lg">${gameState.playerName}</div>
                </div>
            </div>
            <div class="flex gap-8">
                <div class="text-center">
                    <div class="text-xs opacity-60 uppercase font-bold tracking-wider">Level</div>
                    <div class="font-bold text-xl text-indigo-400">${gameState.currentLevel} / ${levels.length}</div>
                </div>
                <div class="text-center">
                    <div class="text-xs opacity-60 uppercase font-bold tracking-wider">Score</div>
                    <div class="font-bold text-xl text-emerald-400" id="score-display">${gameState.score}</div>
                </div>
            </div>
          </div>

          <div class="grid lg:grid-cols-2 gap-6 mb-6">
            <div class="glass-card p-6 rounded-2xl">
                <h2 class="text-2xl font-bold mb-2 flex items-center gap-2">
                    <span class="text-yellow-400">🎯</span> Misi Level ${gameState.currentLevel}
                </h2>
                <p class="text-lg opacity-90 mb-4">${levels[gameState.currentLevel-1].description}</p>
                
                <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700 mb-4">
                    <div class="text-sm font-bold text-indigo-300 mb-1">Target Output:</div>
                    <pre class="font-mono text-2xl tracking-widest text-emerald-400">${levels[gameState.currentLevel-1].target}</pre>
                </div>

                <div class="bg-indigo-900/30 p-3 rounded-lg text-sm border border-indigo-500/30">
                    <span class="font-bold">💡 Hint:</span> ${levels[gameState.currentLevel-1].variables}
                </div>
            </div>

            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                    <span class="text-purple-400">📦</span> Toolbox Kode
                </h3>
                <div id="available-blocks" class="space-y-3">
                    </div>
            </div>
          </div>

          <div class="glass-card p-6 rounded-2xl mb-6">
            <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                <span class="text-emerald-400">🛠️</span> Editor Logika
            </h3>
            <div id="code-area" class="min-h-[180px] bg-slate-900/50 border-2 border-dashed border-slate-700 rounded-xl p-6 flex flex-col gap-2 transition-all">
                <div class="m-auto text-slate-500 text-center">Tarik dan susun blok di sini</div>
            </div>
          </div>

          <div class="grid lg:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-2xl">
                <h3 class="text-xl font-bold mb-4">🖥️ Terminal Output</h3>
                <div class="bg-black/50 p-6 rounded-xl font-mono min-h-[120px] text-xl border border-slate-800" id="program-output">
                    > Siap menjalankan...
                </div>
                <div id="feedback-message" class="mt-4 p-3 rounded-lg hidden"></div>
            </div>

            <div class="glass-card p-6 rounded-2xl flex flex-col gap-3">
                <button id="run-btn" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-black text-lg transition-all shadow-lg shadow-emerald-900/20">
                    ▶ RUN PROGRAM
                </button>
                <button id="clear-btn" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition-all">
                    🔄 RESET EDITOR
                </button>
                <button id="next-level-btn" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-black text-lg transition-all hidden animate-pulse">
                    LANJUT KE LEVEL BERIKUTNYA ➡️
                </button>
            </div>
          </div>
        </div>
      `;

      renderBlocks();
      attachEventListeners();
    }

    function renderBlocks() {
      const container = document.getElementById('available-blocks');
      const level = levels[gameState.currentLevel - 1];
      const allBlocks = [...level.requiredBlocks, ...level.distractorBlocks];
      const shuffledBlocks = allBlocks.sort(() => Math.random() - 0.5);
      
      container.innerHTML = shuffledBlocks.map((block, index) => `
        <div draggable="true" 
             class="code-block p-4 rounded-xl cursor-grab font-mono font-bold active:cursor-grabbing"
             data-index="${index}">
          ${block.label}
        </div>
      `).join('');

      container.querySelectorAll('.code-block').forEach((el, idx) => {
          el.blockData = shuffledBlocks[idx];
          el.addEventListener('dragstart', (e) => {
              gameState.draggedBlock = el.blockData;
              el.classList.add('block-dragging');
          });
          el.addEventListener('dragend', () => el.classList.remove('block-dragging'));
      });
    }

    function attachEventListeners() {
      const area = document.getElementById('code-area');
      area.ondragover = (e) => {
          e.preventDefault();
          area.classList.add('drop-zone-active');
      };
      area.ondragleave = () => area.classList.remove('drop-zone-active');
      area.ondrop = handleDrop;

      document.getElementById('run-btn').onclick = runCode;
      document.getElementById('clear-btn').onclick = clearCodeArea;
      document.getElementById('next-level-btn').onclick = nextLevel;
    }

    function handleDrop(e) {
      e.preventDefault();
      const area = document.getElementById('code-area');
      area.classList.remove('drop-zone-active');
      
      if (!gameState.draggedBlock) return;
      if (area.querySelector('.text-slate-500')) area.innerHTML = '';

      const blockCount = area.querySelectorAll('.placed-block').length;
      const blockDiv = document.createElement('div');
      blockDiv.className = 'placed-block p-4 rounded-lg flex justify-between items-center group';
      blockDiv.style.marginLeft = `${blockCount * 24}px`;
      blockDiv.blockData = gameState.draggedBlock;
      
      blockDiv.innerHTML = `
        <span class="font-mono font-bold text-indigo-300">${gameState.draggedBlock.label}</span>
        <button class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-300 font-bold px-2">✕</button>
      `;

      blockDiv.querySelector('button').onclick = () => {
          blockDiv.remove();
          if (area.children.length === 0) area.innerHTML = '<div class="m-auto text-slate-500 text-center">Tarik dan susun blok di sini</div>';
      };

      area.appendChild(blockDiv);
      gameState.draggedBlock = null;
    }

    // Fungsi Logika Ekstraksi (Sama seperti logika asli Anda namun lebih clean)
    function extractVal(label) {
        const match = label.match(/TO (\d+)/);
        if (match) return parseInt(match[1]);
        if (label.includes('TO i')) return 'i';
        if (label.includes('TO (4-i)')) return '4-i';
        if (label.includes('TO (2*i-1)')) return '2*i-1';
        return 1;
    }

    function runCode() {
        const placed = document.querySelectorAll('.placed-block');
        const level = levels[gameState.currentLevel - 1];
        const outputEl = document.getElementById('program-output');
        const feedback = document.getElementById('feedback-message');

        if (placed.length === 0) {
            showMsg("Seret blok kode terlebih dahulu!", false);
            return;
        }

        // Generate Output Logic (Simulasi Nested Loop)
        let result = "";
        const userBlocks = Array.from(placed).map(b => b.blockData);
        
        try {
            if (gameState.currentLevel === 1) {
                for(let i=1; i<=extractVal(userBlocks[0].label); i++) result += "★";
            } else if (gameState.currentLevel <= 3) {
                let out = extractVal(userBlocks[0].label);
                let inn = extractVal(userBlocks[1].label);
                for(let i=0; i<out; i++) {
                    for(let j=0; j<inn; j++) result += "★";
                    if(i < out-1) result += "\n";
                }
            } else if (gameState.currentLevel === 4) {
                let out = extractVal(userBlocks[0].label);
                for(let i=1; i<=out; i++) {
                    let count = (userBlocks[1].label.includes('TO i')) ? i : extractVal(userBlocks[1].label);
                    for(let j=1; j<=count; j++) result += "★";
                    if(i < out) result += "\n";
                }
            } else if (gameState.currentLevel === 5) {
                let out = extractVal(userBlocks[0].label);
                for(let i=1; i<=out; i++) {
                    let s_count = (userBlocks[1].label.includes('4-i')) ? (4-i) : extractVal(userBlocks[1].label);
                    for(let s=1; s<=s_count; s++) result += " ";
                    let j_count = (userBlocks[2].label.includes('2*i-1')) ? (2*i-1) : extractVal(userBlocks[2].label);
                    for(let j=1; j<=j_count; j++) result += "★";
                    if(i < out) result += "\n";
                }
            }
        } catch(e) { result = "Error Logika!"; }

        outputEl.textContent = result;

        // Validasi
        const isCorrectBlocks = userBlocks.every((b, i) => b.isCorrect && b.order === i);
        const isCorrectOutput = result.trim() === level.target.trim();

        if (isCorrectBlocks && isCorrectOutput) {
            showMsg("🎯 LUAR BIASA! Logikamu sempurna.", true);
            gameState.score += 100;
            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('next-level-btn').classList.remove('hidden');
        } else {
            showMsg("❌ Hmm, sepertinya urutan atau angka loop belum tepat.", false);
        }
    }

    function showMsg(txt, isSuccess) {
        const el = document.getElementById('feedback-message');
        el.className = `mt-4 p-4 rounded-xl font-bold text-center ${isSuccess ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-500' : 'bg-red-900/50 text-red-400 border border-red-500'}`;
        el.textContent = txt;
        el.classList.remove('hidden');
    }

    function clearCodeArea() {
        renderApp();
    }

    function nextLevel() {
        if (gameState.currentLevel < levels.length) {
            gameState.currentLevel++;
            renderApp();
        } else {
            alert("🏆 SEMUA LEVEL SELESAI! Kamu adalah Master Loop!");
            location.reload();
        }
    }

    window.onload = initApp;
  </script>
</body>
</html>
